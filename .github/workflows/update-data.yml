name: Update player data

on:
  schedule:
    - cron: "0 11 1 * *"     # first day of every month at 11:00 UTC
  workflow_dispatch:          # adds a "Run workflow" button for manual refreshes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_data.py
      - name: Commit new data
        run: |
          git config user.name  "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push
