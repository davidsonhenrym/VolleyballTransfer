name: Deploy site

# Publishes index.html + data/ to GitHub Pages. Runs after every data refresh too:
# commits pushed by the data job's GITHUB_TOKEN don't trigger push events on their own.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update player data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
